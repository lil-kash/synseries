[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synseries"
version = "1.0.0"
description = "High-Fidelity Domain-Valid Synthetic Time-Series Generation Framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "rich>=12.0.0",
    "streamlit>=1.20.0"
]

[project.scripts]
synseries = "synseries.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synseries*"]
